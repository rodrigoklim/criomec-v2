on:
  push:
    branches:
      - dev

name: 🚀 Deploy Homolog

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      -
        name: 🚚 Get latest code
        uses: actions/checkout@v4

      -
        name: 📂 Backup Current Files
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          use_insecure_cipher: true
          cipher: aes256-cbc
          script: |
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            BACKUP_DIR="app/dev-criomec-v2-releases/versions/${TIMESTAMP}"

            echo "⚡ Creating backup of current deployment..."
            mkdir -p $BACKUP_DIR
            cp -r app/dev-criomec-v2/* $BACKUP_DIR/

            echo "✅ Backup created at: $BACKUP_DIR"

      -
        name: 📂 Backup Database Before Deployment
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          use_insecure_cipher: true
          cipher: aes256-cbc
          script: |
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            BACKUP_DB_PATH="app/dev-criomec-v2-releases/versions/db_backup_${TIMESTAMP}.sql"

            echo "⚡ Creating database backup..."
            mysqldump -u ${{ secrets.DB_USERNAME }} -p${{ secrets.DB_PASSWORD }} ${{ secrets.DB_NAME }} > $BACKUP_DB_PATH

            echo "✅ Database backup saved: $BACKUP_DB_PATH"

      -
        name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: dev-criomec-v2/

      -
        name: 🖥️ Run Composer on Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          use_insecure_cipher: true
          cipher: aes256-cbc
          script: |
            cd  app/dev-criomec-v2/
            /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader --no-interaction
            echo "✅ Composer install completed"

      -
        name: 📄 Upload .env file
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          use_insecure_cipher: true
          cipher: aes256-cbc
          script: |
            echo "⚡ Copying .env file to the application root..."
            mkdir -p /home/youruser/env_files/
            echo "${{ secrets.ENV_FILE_CONTENTS }}" > /home/youruser/env_files/dev-criomec-v2.env
            cp /home/youruser/env_files/dev-criomec-v2.env app/dev-criomec-v2/.env
            chmod 600 app/dev-criomec-v2/.env
            echo "✅ .env file copied successfully!"

      -
        name: 🛠️ Run Migrations
        uses: appleboy/ssh-action@v0.1.10
        id: migrate
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          use_insecure_cipher: true
          cipher: aes256-cbc
          script: |
            cd app/dev-criomec-v2/
            php artisan migrate --force
            echo "✅ Database migrations executed successfully"

      -
        name: ❌ Rollback on Failure
        if: steps.migrate.outcome == 'failure'
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          use_insecure_cipher: true
          cipher: aes256-cbc
          script: |
            echo "🚨 Migration failed! Rolling back to previous version..."

            TIMESTAMP=$(ls -t app/dev-criomec-v2/versions | head -n 1)
            BACKUP_DIR="app/dev-criomec-v2/versions/$TIMESTAMP"

            if [ -d "$BACKUP_DIR" ]; then
              rm -rf app/dev-criomec-v2/*
              cp -r $BACKUP_DIR/* app/dev-criomec-v2/
              echo "✅ Rolled back to previous version: $TIMESTAMP"
            else
              echo "⚠️ No valid backup found, rollback skipped!"
            fi

            echo "⚡ Restoring database backup..."
            mysql -u ${{ secrets.DB_USER }} -p${{ secrets.DB_PASSWORD }} ${{ secrets.DB_NAME }} < " app/dev-criomec-v2/versions/db_backup_${TIMESTAMP}.sql"
            echo "✅ Database restored!"

      -
        name: ♻️ Restart Queue Workers
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          use_insecure_cipher: true
          cipher: aes256-cbc
          script: |
            cd  app/dev-criomec-v2/
            php artisan queue:restart
            echo "✅ Queue workers restarted"
